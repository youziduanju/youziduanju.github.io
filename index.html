<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="柚子短剧最新地址发布页">
  <title>柚子短剧｜最新地址发布页</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #050505;
      --card: #ffffff;
      --text: #171717;
      --muted: #687385;
      --accent: #ff5d67;
      --gold: #f4bd25;
    }

    * { box-sizing: border-box; }

    html { background: var(--page); }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #fff;
    }

    .page {
      width: min(100% - 32px, 560px);
      margin: 0 auto;
      padding: 34px 0 46px;
    }

    .brand {
      display: block;
      width: min(100%, 500px);
      height: auto;
      margin: 0 auto 22px;
    }

    .card {
      margin-top: 12px;
      padding: 24px 22px;
      color: var(--text);
      text-align: center;
      background: var(--card);
      border-radius: 13px;
    }

    .card h1,
    .card h2 {
      margin: 0 0 16px;
      font-size: 19px;
      line-height: 1.4;
    }

    .bookmark {
      font-size: 18px;
      font-weight: 700;
    }

    .bookmark strong { color: var(--accent); }

    .address {
      display: block;
      width: 100%;
      margin: 12px 0 0;
      padding: 14px 16px;
      border: 1px solid #e7e7e7;
      border-radius: 10px;
      color: #52687d;
      font-size: 18px;
      line-height: 1.35;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .address:hover {
      border-color: var(--gold);
      box-shadow: 0 8px 22px rgba(244, 189, 37, .18);
      transform: translateY(-1px);
    }

    .address.primary {
      border-color: var(--gold);
      color: #2b2b2b;
      font-weight: 700;
    }

    .label {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .placeholder {
      margin: 9px 0 0;
      color: #52687d;
      font-size: 16px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .notice {
      text-align: left;
    }

    .notice p {
      margin: 9px 0 0;
      color: #566373;
      font-size: 15px;
      line-height: 1.7;
    }

    footer {
      padding-top: 22px;
      color: #7f7f7f;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 20px, 560px); padding-top: 22px; }
      .card { padding: 21px 16px; }
      .address { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="brand" src="logo.png" alt="柚子短剧">

    <section class="card bookmark">
      <strong>Ctrl+D</strong> 收藏此页，防止迷路
    </section>

    <section class="card">
      <h1>柚子短剧最新地址</h1>

      <a class="address primary" href="https://youziduanju.com" rel="noopener">
        <span class="label">主域名</span>
        https://youziduanju.com
      </a>

      <a class="address" href="https://youzidj.com" rel="noopener">
        <span class="label">短域名 · 自动跳转至主站</span>
        https://youzidj.com
      </a>

      <p class="note">请使用 HTTPS 访问。若主域名无法打开，可先通过本发布页获取最新地址。</p>
    </section>

    <section class="card">
      <h2>请收藏下面的地址发布页</h2>
      <!-- 创建完成后，把下面两行替换为你的真实 GitLab 与 GitHub Pages 地址。 -->
      <p class="placeholder">GitLab：创建完成后填写</p>
      <p class="placeholder">GitHub Pages：创建完成后填写</p>
    </section>

    <section class="card notice">
      <h2>注意事项</h2>
      <p>• 推荐使用 Chrome、Edge 或 Safari 浏览器访问。</p>
      <p>• 请认准主域名 youziduanju.com，避免进入仿冒网站。</p>
      <p>• 建议收藏或截图保存本页面。</p>
    </section>

    <footer>© 柚子短剧 · 地址发布页</footer>
  </main>
</body>
</html>
